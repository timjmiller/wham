on:
  push:
    branches: [main, master, devel, lab]
  pull_request:
    branches: [main, master, devel, lab]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
